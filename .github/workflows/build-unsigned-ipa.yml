name: Build unsigned CookMate IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Align Expo dependencies
        run: CI=1 npx expo install --fix
      - name: Generate iOS project
        run: CI=1 npx expo prebuild -p ios --clean
      - name: Install CocoaPods
        run: cd ios && pod install --repo-update
      - name: Build unsigned device app
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CookMate-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CookMate-unsigned-ipa
          path: CookMate-unsigned.ipa
          if-no-files-found: error
