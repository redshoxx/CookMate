name: Build unsigned CookMate IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align Expo dependencies
        run: CI=1 npx expo install --fix

      - name: Verify iOS JavaScript bundle
        run: CI=1 npx expo export --platform ios --output-dir dist --clear

      - name: Generate iOS project
        run: CI=1 npx expo prebuild -p ios --clean

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      - name: Build unsigned device app
        shell: bash
        run: |
          set -uo pipefail

          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "No Xcode workspace found in ios/"
            exit 1
          fi

          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "================ XCODE ERRORS ================"
            grep -nE '(^|[[:space:]])error:|fatal error:|Command PhaseScriptExecution failed|The following build commands failed|BUILD FAILED' xcodebuild.log | tail -200 || true
            echo "================================================"
            exit "$STATUS"
          fi

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CookMate-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "No .app bundle found"
            exit 1
          fi

          rm -rf Payload CookMate-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CookMate-unsigned.ipa Payload
          ls -lh CookMate-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CookMate-unsigned-ipa
          path: CookMate-unsigned.ipa
          if-no-files-found: error
