name: Build unsigned CookMate IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align Expo dependencies
        run: CI=1 npx expo install --fix

      - name: Generate iOS project
        run: CI=1 npx expo prebuild -p ios --clean

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "No Xcode workspace found in ios/"
            exit 1
          fi

          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "No .app bundle found"
            exit 1
          fi

          rm -rf Payload CookMate-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CookMate-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CookMate-unsigned-ipa
          path: CookMate-unsigned.ipa
          if-no-files-found: error
